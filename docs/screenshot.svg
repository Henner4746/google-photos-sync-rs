<svg xmlns="http://www.w3.org/2000/svg" width="968" height="820" viewBox="0 0 484 410" role="img" aria-labelledby="title desc">
  <title id="title">Google Photos Sync tray flyout</title>
  <desc id="desc">A monochrome Material-inspired backup dashboard showing 1,245 screenshots, 4 AMD clips, and no pending files.</desc>
  <rect width="484" height="410" rx="14" fill="#0f0f0f"/>
  <style>
    .ui{font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}.muted{fill:#adadad}.label{fill:#999;font-size:13px}.body{font-size:15px}.value{fill:#f5f5f5;font-size:22px;font-weight:600}.button{font-size:14px;font-weight:600}
  </style>
  <g class="ui">
    <text x="24" y="43" fill="#f5f5f5" font-size="24" font-weight="600">Foto-Sicherung</text>
    <text x="24" y="66" class="muted body">Google Fotos · lokal indiziert</text>
    <rect x="344" y="22" width="116" height="32" rx="16" fill="#2e2e2e"/>
    <circle cx="360" cy="38" r="3" fill="#ebebeb"/>
    <text x="370" y="43" fill="#e6e6e6" font-size="13">Autostart aktiv</text>
    <rect x="24" y="86" width="436" height="101" rx="16" fill="#1a1a1a"/>
    <circle cx="45" cy="114" r="5" fill="#e6e6e6"/>
    <text x="64" y="121" fill="#f5f5f5" font-size="18" font-weight="600">Alles gesichert</text>
    <text x="40" y="153" class="muted body">Keine neuen oder doppelten Medien</text>
    <rect x="40" y="170" width="404" height="4" rx="2" fill="#e6e6e6"/>
    <rect x="24" y="205" width="436" height="69" rx="12" fill="#1a1a1a"/>
    <path d="M169 218v43M314 218v43" stroke="#3d3d3d"/>
    <text x="36" y="230" class="label">Screenshots</text><text x="36" y="259" class="value">1245</text>
    <text x="182" y="230" class="label">AMD-Clips</text><text x="182" y="259" class="value">4</text>
    <text x="327" y="230" class="label">Noch offen</text><text x="327" y="259" class="value">0</text>
    <text x="24" y="306" class="label">Letzter Lauf: gerade eben</text>
    <text x="460" y="306" text-anchor="end" class="label">Nächste Prüfung in 15 Min.</text>
    <rect x="24" y="338" width="210" height="44" rx="22" fill="#f5f5f5"/>
    <text x="129" y="365" text-anchor="middle" fill="#0a0a0a" class="button">Jetzt sichern</text>
    <rect x="250" y="338" width="210" height="44" rx="22" fill="#2e2e2e"/>
    <text x="355" y="365" text-anchor="middle" fill="#f5f5f5" class="button">Pausieren</text>
  </g>
</svg>
