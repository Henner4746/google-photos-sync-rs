<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="984" viewBox="0 0 720 656" role="img" aria-labelledby="title desc">
  <title id="title">Google Photos Sync folder dashboard</title>
  <desc id="desc">A monochrome Material-style Windows app with backup status, two managed folders, source actions, a safe test run, and 1,249 protected media files.</desc>
  <rect width="720" height="656" rx="14" fill="#0d0d0d"/>
  <style>
    .ui{font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}.primary{fill:#f5f5f5}.secondary{fill:#b8b8b8}.muted{fill:#9e9e9e}.heading{font-size:18px;font-weight:600}.body{font-size:14px}.label{font-size:12px}.button{font-size:14px;font-weight:600}.metric{font-size:22px;font-weight:600}
  </style>
  <g class="ui">
    <text x="24" y="41" class="primary" font-size="25" font-weight="600">Google Photos Sync</text>
    <text x="24" y="64" class="secondary body">Sichert Ordner ohne doppelte Uploads</text>
    <rect x="540" y="21" width="115" height="32" rx="16" fill="#2b2b2b"/><circle cx="555" cy="37" r="3" fill="#f0f0f0"/><text x="566" y="42" class="primary label">Autostart</text>
    <text x="686" y="47" text-anchor="middle" class="primary" font-size="22">×</text>

    <rect x="24" y="86" width="672" height="104" rx="16" fill="#1a1a1a"/>
    <circle cx="45" cy="113" r="5" fill="#f0f0f0"/>
    <text x="64" y="120" class="primary heading">Alles gesichert</text>
    <text x="40" y="147" class="secondary body">Vorhandene Bilder und Videos werden nicht erneut hochgeladen</text>
    <text x="40" y="170" class="muted label">Letzte Sicherung: gerade eben</text>
    <text x="680" y="170" text-anchor="end" class="muted label">Nächste Prüfung in 15 Min.</text>
    <rect x="40" y="178" width="640" height="4" rx="2" fill="#f0f0f0"/>

    <rect x="24" y="206" width="672" height="68" rx="12" fill="#1a1a1a"/>
    <path d="M247 219v42M471 219v42" stroke="#484848"/>
    <text x="40" y="229" class="muted label">Gesichert</text><text x="40" y="260" class="primary metric">1249</text>
    <text x="264" y="229" class="muted label">Ordner</text><text x="264" y="260" class="primary metric">2</text>
    <text x="488" y="229" class="muted label">Noch offen</text><text x="488" y="260" class="primary metric">0</text>

    <text x="24" y="322" class="primary heading">Gesicherte Ordner</text>
    <rect x="526" y="294" width="170" height="40" rx="20" fill="#2b2b2b"/><text x="611" y="319" text-anchor="middle" class="primary button">+  Ordner hinzufügen</text>
    <rect x="24" y="342" width="672" height="134" rx="12" fill="#1a1a1a"/>
    <rect x="24" y="342" width="672" height="58" fill="#2b2b2b"/>
    <text x="38" y="367" class="primary" font-size="15" font-weight="600">Screenshots</text><text x="682" y="366" text-anchor="end" class="secondary label">Aktiv  ·  Bilder</text>
    <text x="38" y="389" class="muted label">C:\Users\Alex\Pictures\Screenshots</text>
    <text x="38" y="425" class="primary" font-size="15" font-weight="600">AMD-Clips</text><text x="682" y="424" text-anchor="end" class="secondary label">Aktiv  ·  Videos</text>
    <text x="38" y="447" class="muted label">C:\Users\Alex\Videos\Radeon ReLive</text>

    <rect x="24" y="492" width="672" height="76" rx="12" fill="#1a1a1a"/>
    <text x="40" y="512" class="muted label">Zielalbum für neue Medien</text><text x="40" y="534" class="primary label">Screenshots</text>
    <g class="button primary" text-anchor="middle">
      <rect x="288" y="518" width="90" height="36" rx="18" fill="#2b2b2b"/><text x="333" y="541">Speichern</text>
      <rect x="390" y="518" width="88" height="36" rx="18" fill="#2b2b2b"/><text x="434" y="541">Öffnen</text>
      <rect x="486" y="518" width="98" height="36" rx="18" fill="#2b2b2b"/><text x="535" y="541">Pausieren</text>
      <rect x="592" y="518" width="88" height="36" rx="18" fill="#2b2b2b"/><text x="636" y="541">Entfernen</text>
    </g>

    <g class="button" text-anchor="middle">
      <rect x="24" y="588" width="212" height="44" rx="22" fill="#f5f5f5"/><text x="130" y="615" fill="#0a0a0a">Jetzt sichern</text>
      <rect x="248" y="588" width="148" height="44" rx="22" fill="#2b2b2b"/><text x="322" y="615" class="primary">Testlauf</text>
      <rect x="408" y="588" width="154" height="44" rx="22" fill="#2b2b2b"/><text x="485" y="615" class="primary">Automatik pausieren</text>
      <rect x="574" y="588" width="122" height="44" rx="22" fill="#2b2b2b"/><text x="635" y="615" class="primary">Protokoll</text>
    </g>
  </g>
</svg>
