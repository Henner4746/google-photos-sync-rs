name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject personal workstation traces
        shell: pwsh
        run: |
          $forbidden = @(
            ('C:\Users\' + 'Henrik\'),
            ('E:\' + 'Screenshots'),
            ('Henrik-' + 'Google-Photos-Sync')
          )
          foreach ($needle in $forbidden) {
            $matches = git grep -n -I -F -- $needle
            $grepExitCode = $LASTEXITCODE
            if ($grepExitCode -eq 0) {
              throw "Personal workstation trace found: $needle`n$matches"
            }
            if ($grepExitCode -ne 1) {
              throw "Repository trace scan failed for: $needle"
            }
          }
          exit 0
      - name: Do not promote the unsigned legacy release
        shell: pwsh
        run: |
          $matches = Select-String -Path README.md,docs\index.html -Pattern 'releases/latest|Für Windows laden'
          if ($matches) {
            throw "The public pages must not promote a download until the signed v2 installer exists.`n$matches"
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Compile Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\gphotos-sync.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
