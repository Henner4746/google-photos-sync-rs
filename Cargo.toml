[package]
name = "gphotos-sync"
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
description = "Native Windows tray backup for Google Photos with content-aware deduplication"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Henner4746/google-photos-sync-rs"
keywords = ["google-photos", "backup", "windows", "deduplication", "tray"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "native-tls", "query"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
